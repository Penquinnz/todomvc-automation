[pytest]
# Target site. Override with: pytest --base-url <url>
base_url = https://todomvc.com/examples/react/dist/
testpaths = tests
addopts =
    -ra
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=test-results
    --html=reports/report.html
    --self-contained-html
# A known-defect test that starts passing must fail the run,
# so someone removes the xfail marker on purpose.
xfail_strict = true
markers =
    smoke: critical user journeys, run on every change
    P1: priority 1 (critical)
    P2: priority 2 (high)
    P3: priority 3 (medium)
    known_defect: documents behaviour that deviates from the TodoMVC spec
