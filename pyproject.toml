[project]
name = "todomvc-automation"
version = "1.0.0"
description = "Playwright + Pytest UI tests for React TodoMVC"
readme = "README.md"
requires-python = ">=3.10"
# Same pinned versions as requirements.txt. Keep both files in sync.
dependencies = [
    "playwright==1.63.0",
    "pytest==8.4.2",
    "pytest-playwright==0.7.1",
    "pytest-html==4.2.0",
]

[tool.uv]
# This is a test project, not a library to install.
package = false
